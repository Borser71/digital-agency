    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;

        body {
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;

        }

        h1 {
            color: #3b82f6;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .payment-info {
            font-size: 1.3rem;
            line-height: 2;
            color: #cbd5e1;
            margin: 20px 0 30px;
        }

        .payment-info div {
            margin: 10px 0;
        }

        .payment-info .address {
            color: #fff;
            font-weight: bold;
            word-break: break-all;
        }

        /* ===== КАЛЕНДАРЬ ===== */
        .calendar-block {
            margin: 30px 0;
            padding: 25px 20px;
            background: #0f172a;
            border-radius: 15px;
            border-left: 4px solid #3b82f6;
            text-align: left;
        }

        .calendar-block h2 {
            color: #3b82f6;
            font-size: 1.4rem;
            margin-bottom: 15px;

        }

        .calendar-block label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 15px;
        }

        .calendar-block select,
        .calendar-block input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }

        .calendar-block select:focus,
        .calendar-block input:focus {
            box-shadow: 0 0 0 2px #3b82f6;
        }

        .calendar-block button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;

            transition: background 0.3s ease;

            background: #2563eb;
        }

        .calendar-block button:disabled {

            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            transition: background 0.3s ease;
            margin-top: 10px;
        }

</head>
<body>
    <div class="container">
        <h1>💳 Оплата криптовалютой</h1>

        <div class="payment-info">
            <div><strong>ETH или USDT или USDC</strong></div>
            <div class="address">Адрес: 0x9712aE4913fb7eeA0225c0C7392c40d8B2148a6A</div>
            <div>Сети: Optimism, Arbitrum</div>
        </div>

        <!-- ===== БЛОК КАЛЕНДАРЯ ===== -->
        <div class="calendar-block">
            <h2>📅 Выберите дату начала работы</h2>

            <label for="dateSelect">Свободные даты:</label>
            <select id="dateSelect">
                <option value="">Загрузка...</option>
            </select>

            <label for="emailInput">Ваш email:</label>
            <input type="email" id="emailInput" placeholder="example@mail.ru">

            <button id="submitBtn">Записаться</button>

            <div id="calendarMessage"></div>
        </div>

        <a href="https://borisov.store/" class="btn-home">Вернуться на главную</a>
    </div>

    <script>
        // URL вашего Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzj0pogdJ8DRzWsxqua-sAFFV6JylONsixFlyfEVp6WMJx67KHbICs7YrwVcCTkZdeelA/exec';

        const dateSelect = document.getElementById('dateSelect');
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('calendarMessage');

        // ===== Загрузка свободных дат =====
        fetch(SCRIPT_URL + '?action=getDates')
            .then(response => response.json())
            .then(data => {
                dateSelect.innerHTML = '';
                if (data.dates && data.dates.length > 0) {
                    data.dates.forEach(date => {
                        const option = document.createElement('option');
                        option.value = date;
                        option.textContent = formatDate(date);
                        dateSelect.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'Нет свободных дат';
                    dateSelect.appendChild(option);
                }
            })
            .catch(error => {
                dateSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                console.error('Ошибка:', error);
            });

        // ===== Форматирование даты =====
        function formatDate(dateStr) {
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            const parts = dateStr.split('-');
            const day = parseInt(parts[2], 10);
            const month = months[parseInt(parts[1], 10) - 1];
            const year = parts[0];
            return day + ' ' + month + ' ' + year;
        }

        // ===== Отправка записи =====
        submitBtn.addEventListener('click', function() {
            const date = dateSelect.value;
            const email = emailInput.value.trim();

            messageDiv.className = '';
            messageDiv.textContent = '';

            if (!date) {
                messageDiv.className = 'calendar-message error';
                messageDiv.textContent = 'Выберите дату';
                return;
            }

            if (!email || !email.includes('@')) {
                messageDiv.className = 'calendar-message error';
                messageDiv.textContent = 'Введите корректный email';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';

            const formData = new FormData();
            formData.append('email', email);
            formData.append('date', date);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    messageDiv.className = 'calendar-message success';
                    messageDiv.textContent = '✅ Вы записаны на ' + formatDate(date) + '! Проверьте почту.';
                    emailInput.value = '';
                    setTimeout(() => location.reload(), 3000);
                } else {
                    throw new Error(data.message || 'Ошибка');
                }
            })
            .catch(error => {
                messageDiv.className = 'calendar-message error';
                messageDiv.textContent = '❌ Ошибка: ' + error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Записаться';
            });
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за заказ | Borisov Store</title>
    <link rel="icon" type="image/x-icon" href="https://borisov.store/images/inter1.ico">

    <!-- Яндекс.Метрика (обязательно, чтобы работал ym()) -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=110222077', 'ym');

        ym(110222077, 'init', {
            clickmap:true,
            trackLinks:true,
            accurateTrackBounce:true,
            webvisor:true,
            ecommerce:"dataLayer"
        });
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/110222077" style="position:absolute; left:-9999px;" alt="" /></div></noscript>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .container { max-width: 600px; padding: 40px; background: #1f2937; border-radius: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #3b82f6; margin-bottom: 20px; }
        p { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 10px; }
        .order-id { font-weight: bold; color: #fff; }
        .btn { display: inline-block; margin-top: 25px; padding: 12px 30px; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none; transition: background 0.3s; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Спасибо за заказ!</h1>
        <p>Ваш заказ успешно оплачен.</p>
        
        <p>Мы свяжемся с вами в ближайшее время.</p>
        <a href="https://borisov.store/" class="btn">Вернуться на главную</a>
    </div>

    <script>
        // ---- Получаем номер заказа из URL ----
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        if (orderId) {
            document.getElementById('orderId').textContent = orderId;
        }

        // ---- Отправляем purchase в Яндекс.Метрику ----
        try {
            const orderData = JSON.parse(localStorage.getItem('lastOrder'));
            if (orderData && orderData.products && orderData.products.length > 0) {
                ym(110222077, 'ecommerce', 'purchase', {
                    order_id: orderData.paymentId || orderId,
                    revenue: orderData.total,
                    products: orderData.products
                });
                // Очищаем после отправки
                localStorage.removeItem('lastOrder');
                localStorage.removeItem('cart');
            } else {
                // Если данных нет в localStorage, но есть orderId — отправляем хотя бы его
                if (orderId) {
                    ym(110222077, 'ecommerce', 'purchase', {
                        order_id: orderId,
                        revenue: 0,
                        products: []
                    });
                }
            }
        } catch (e) {
            console.warn('Ecommerce не отправлен:', e);
        }
    </script>
</body>
</html>

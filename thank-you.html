
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за заказ | Borisov Store</title>
    <link rel="icon" type="image/x-icon" href="https://borisov.store/images/inter1.ico">
    <style>
        /* Базовые стили как на главной */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .container { max-width: 600px; padding: 40px; background: #1f2937; border-radius: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        h1 { font-size: 2.5rem; color: #3b82f6; margin-bottom: 20px; }
        p { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 10px; }
        .order-id { font-weight: bold; color: #fff; }
        .btn { display: inline-block; margin-top: 25px; padding: 12px 30px; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none; transition: background 0.3s; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Спасибо за заказ!</h1>
        <p>Ваш заказ успешно оплачен.</p>
        <p>Номер заказа: <span class="order-id" id="orderId">—</span></p>
        <p>Мы свяжемся с вами в ближайшее время.</p>
        <a href="https://borisov.store/" class="btn">Вернуться на главную</a>
    </div>

    <script>
        // ---- Получаем параметры из URL (orderId) ----
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');

        if (orderId) {
            document.getElementById('orderId').textContent = orderId;
        }

        // ---- Отправка purchase в Яндекс.Метрику (ТОЛЬКО ПОСЛЕ ОПЛАТЫ) ----
        // Здесь нужно передать данные заказа. Если вы их не сохранили, можно передать только orderId.
        // Но лучше, чтобы данные о заказе приходили сюда из localStorage или из ответа ЮKassa.

        // Пример: если вы сохранили данные заказа в localStorage перед переходом на оплату
        try {
            const orderData = JSON.parse(localStorage.getItem('lastOrder'));
            if (orderData) {
                ym(110222077, 'ecommerce', 'purchase', {
                    order_id: orderData.paymentId || orderId,
                    revenue: orderData.total,
                    products: orderData.products || []
                });
                // Очищаем корзину после успешной оплаты (если не сделали это ранее)
                localStorage.removeItem('cart');
                localStorage.removeItem('lastOrder');
            }
        } catch (e) {
            console.warn('Не удалось отправить purchase:', e);
        }
    </script>
</body>
</html>
